<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Para Buch!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #d7e9ec;
      --sky-deep: #b9d5db;
      --felt: #2f7f77;
      --felt-deep: #1f5e58;
      --plum: #47215f;
      --plum-soft: #6b4a82;
      --marigold: #f4b63f;
      --marigold-deep: #c98a17;
      --paper: #fffdf7;
      --cardboard: #cdb88f;
      --cardboard-dark: #a38c5c;

      /* Kafelek dopasowuje się do okna, ale nie rośnie ponad 92 px */
      --tile: min(92px, calc((100vw - 120px) / 6.9), calc((100vh - 230px) / 5.5));
      --gap: calc(var(--tile) * 0.15);
      --pad: calc(var(--tile) * 0.32);
      --board-w: calc(var(--tile) * 6 + var(--gap) * 5);
      --tray-w: calc(var(--board-w) + var(--pad) * 2);
      --thick: 10px;
      --half: 5px;
      --flip: 320ms;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Grandstander", "Trebuchet MS", system-ui, sans-serif;
      color: var(--plum);
      background: radial-gradient(120% 90% at 50% 0%, #eaf4f5 0%, var(--sky) 50%, var(--sky-deep) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
    }

    .top {
      width: var(--tray-w);
      max-width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 46px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .hint {
      margin: 8px 0 0;
      font-size: 16px;
      font-weight: 500;
      color: var(--plum-soft);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    #moves {
      font-size: 20px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    button.action {
      font: inherit;
      font-size: 17px;
      font-weight: 700;
      color: var(--plum);
      padding: 12px 20px 9px;
      border: none;
      border-radius: 12px;
      background: var(--marigold);
      cursor: pointer;
      box-shadow: 0 5px 0 var(--marigold-deep), 0 12px 18px -8px rgba(71, 33, 95, 0.45);
      transition: transform 90ms ease-out, box-shadow 90ms ease-out, background-color 120ms;
    }
    button.action:hover { background: #f7c35c; }
    button.action:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--marigold-deep), 0 4px 8px -4px rgba(71, 33, 95, 0.45);
    }
    button.action:focus-visible {
      outline: 3px solid var(--plum);
      outline-offset: 3px;
    }

    /* Scena 3D: jedna perspektywa dla tacy i wszystkich kafelków */
    .scene {
      position: relative;
      margin-top: 18px;
      perspective: 1500px;
      perspective-origin: 50% 35%;
    }

    .tray {
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      position: relative;
      padding: var(--pad);
      border-radius: 18px 18px 8px 8px;
      background:
        radial-gradient(circle at 30% 15%, rgba(255, 255, 255, 0.12), transparent 60%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 5px),
        var(--felt);
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.1),
        inset 0 14px 28px rgba(0, 0, 0, 0.28),
        0 70px 50px -45px rgba(20, 60, 56, 0.65);
      transform-style: preserve-3d;
      transform: rotateX(calc(24deg + var(--tilt-y))) rotateY(var(--tilt-x));
      transition: transform 500ms cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    /* Przednia ścianka tacy, widoczna dzięki pochyleniu */
    .tray::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 100%;
      height: 36px;
      background: linear-gradient(var(--felt-deep), #163f3b);
      transform-origin: top;
      transform: rotateX(-90deg);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, var(--tile));
      grid-template-rows: repeat(5, var(--tile));
      gap: var(--gap);
      transform-style: preserve-3d;
    }

    .card {
      position: relative;
      padding: 0;
      border: none;
      background: none;
      font: inherit;
      cursor: pointer;
      transform-style: preserve-3d;
    }
    .card:focus-visible {
      outline: 3px solid var(--marigold);
      outline-offset: 5px;
      border-radius: 10px;
    }
    .card.matched,
    .card.revealed { cursor: default; }
    .board.locked .card { cursor: wait; }

    /* Cień kafelka leży na filcu i zostaje na miejscu, gdy kafelek się unosi */
    .shadow {
      position: absolute;
      inset: 8% 5% 0;
      border-radius: 10px;
      background: rgba(10, 44, 40, 0.55);
      filter: blur(5px);
      transform: translate3d(0, 3px, 0);
      transition: transform 180ms ease-out, opacity 180ms ease-out;
      animation: shadow-deal 520ms ease-out backwards;
      animation-delay: calc(var(--i) * 22ms);
    }

    .card-float {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: translate3d(0, 0, var(--half)) rotateZ(0deg);
      transition: transform 180ms ease-out;
      animation: deal 520ms cubic-bezier(0.2, 0.8, 0.3, 1.1) backwards;
      animation-delay: calc(var(--i) * 22ms);
    }

    .card-inner {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transform: translateZ(0) rotateY(0deg);
    }
    .card.revealed .card-inner,
    .card.matched .card-inner { transform: translateZ(0) rotateY(180deg); }

    .card.animate .card-inner { animation: flip-close var(--flip) ease-in-out; }
    .card.animate.revealed .card-inner,
    .card.animate.matched .card-inner { animation: flip-open var(--flip) ease-in-out; }

    .card.animate .shadow { animation: shadow-close var(--flip) ease-in-out; }
    .card.animate.revealed .shadow,
    .card.animate.matched .shadow { animation: shadow-open var(--flip) ease-in-out; }

    .card.animate.matched .card-float { animation: settle 420ms ease-out var(--flip) backwards; }

    .board:not(.locked) .card:not(.revealed):not(.matched):hover .card-float,
    .card:not(.revealed):not(.matched):focus-visible .card-float {
      transform: translate3d(0, 0, 14px) rotateZ(0deg);
    }
    .board:not(.locked) .card:not(.revealed):not(.matched):hover .shadow,
    .card:not(.revealed):not(.matched):focus-visible .shadow {
      transform: translate3d(0, 9px, 0) scale(1.05);
      opacity: 0.6;
    }

    .face {
      position: absolute;
      inset: 0;
      border-radius: 9px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back {
      transform: translateZ(var(--half));
      background:
        linear-gradient(160deg, rgba(255, 255, 255, 0.16), transparent 45%),
        radial-gradient(circle, var(--marigold) 0 1.6px, transparent 2.2px) 0 0 / 11px 11px,
        var(--plum);
      box-shadow: inset 0 0 0 6px var(--plum), inset 0 0 0 8px var(--marigold);
    }

    .front {
      transform: rotateY(180deg) translateZ(var(--half));
      background: linear-gradient(160deg, #ffffff, var(--paper) 60%, #f3eee2);
      box-shadow: inset 0 0 0 1px rgba(71, 33, 95, 0.1);
      font-size: calc(var(--tile) * 0.5);
      line-height: 1;
      transition: background-color 200ms, box-shadow 200ms;
    }
    .card.matched .front {
      background: #fff1cc;
      box-shadow: inset 0 0 0 3px var(--marigold), inset 0 0 18px rgba(244, 182, 63, 0.45);
    }

    /* Cztery krawędzie z tektury nadają kafelkowi grubość */
    .edge {
      position: absolute;
      background: var(--cardboard);
    }
    .edge-t,
    .edge-b {
      left: 8px;
      right: 8px;
      height: var(--thick);
      transform: rotateX(90deg);
    }
    .edge-t { top: calc(var(--half) * -1); background: #ddcba6; }
    .edge-b { top: calc(100% - var(--half)); background: var(--cardboard-dark); }
    .edge-l,
    .edge-r {
      top: 8px;
      bottom: 8px;
      width: var(--thick);
      transform: rotateY(90deg);
    }
    .edge-l { left: calc(var(--half) * -1); }
    .edge-r { left: calc(100% - var(--half)); }

    @keyframes flip-open {
      0%   { transform: translateZ(0) rotateY(0deg); }
      50%  { transform: translateZ(48px) rotateY(90deg); }
      100% { transform: translateZ(0) rotateY(180deg); }
    }
    @keyframes flip-close {
      0%   { transform: translateZ(0) rotateY(180deg); }
      50%  { transform: translateZ(48px) rotateY(90deg); }
      100% { transform: translateZ(0) rotateY(0deg); }
    }
    @keyframes shadow-open {
      50% { transform: translate3d(0, 16px, 0) scale(1.12); opacity: 0.35; }
    }
    @keyframes shadow-close {
      50% { transform: translate3d(0, 16px, 0) scale(1.12); opacity: 0.35; }
    }
    @keyframes settle {
      0%   { transform: translate3d(0, 0, var(--half)) rotateZ(0deg); }
      40%  { transform: translate3d(0, 0, 22px) rotateZ(0deg); }
      100% { transform: translate3d(0, 0, var(--half)) rotateZ(0deg); }
    }
    @keyframes deal {
      0%   { transform: translate3d(0, calc(var(--tile) * -0.5), 240px) rotateZ(var(--r)); }
      70%  { transform: translate3d(0, 0, 10px) rotateZ(0deg); }
      100% { transform: translate3d(0, 0, var(--half)) rotateZ(0deg); }
    }
    @keyframes shadow-deal {
      0%  { opacity: 0; }
      60% { opacity: 0.2; }
    }

    .win {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .win[hidden] { display: none; }

    .win-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 30px 40px 34px;
      border-radius: 18px;
      background: var(--paper);
      text-align: center;
      box-shadow: 0 8px 0 var(--cardboard), 0 34px 50px -12px rgba(23, 60, 64, 0.5);
      animation: pop 460ms cubic-bezier(0.2, 0.9, 0.3, 1.3);
    }

    .panel-title {
      max-width: 420px;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.15;
      text-wrap: balance;
    }

    .panel-buttons {
      display: flex;
      gap: 14px;
    }

    button.action.secondary {
      background: var(--paper);
      box-shadow: 0 5px 0 var(--cardboard-dark), 0 0 0 2px var(--cardboard) inset;
    }
    button.action.secondary:hover { background: #fff6dd; }
    button.action:disabled { opacity: 0.6; cursor: default; }

    .score-status {
      min-height: 1.2em;
      max-width: 360px;
      font-size: 16px;
      font-weight: 500;
      color: var(--plum-soft);
    }
    .score-status:empty { display: none; }

    button.link {
      font: inherit;
      font-size: inherit;
      font-weight: 700;
      color: var(--plum);
      padding: 0;
      border: none;
      background: none;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    button.link:focus-visible {
      outline: 3px solid var(--marigold);
      outline-offset: 2px;
      border-radius: 4px;
    }
    button[hidden] { display: none; }

    .account {
      margin: 6px 0 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--plum-soft);
    }
    .account[hidden] { display: none; }
    .account strong { color: var(--plum); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(71, 33, 95, 0.35);
    }
    .modal[hidden] { display: none; }

    .auth-panel { min-width: 340px; }

    .auth-panel label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      font-size: 16px;
      font-weight: 700;
      text-align: left;
    }

    .auth-panel input {
      font: inherit;
      font-size: 17px;
      font-weight: 500;
      color: var(--plum);
      padding: 9px 12px;
      border: 2px solid var(--cardboard);
      border-radius: 10px;
      background: #fff;
    }
    .auth-panel input:focus-visible {
      outline: 3px solid var(--marigold);
      outline-offset: 1px;
    }

    .field-hint {
      font-size: 13px;
      font-weight: 500;
      color: var(--plum-soft);
    }
    .field-hint[hidden] { display: none; }

    .auth-panel .score-status.error { color: #b3261e; }

    .ranking {
      width: var(--tray-w);
      max-width: 100%;
      margin-top: 56px;
      padding: 18px 24px 20px;
      border-radius: 16px;
      background: rgba(255, 253, 247, 0.75);
      box-shadow: 0 4px 0 var(--cardboard);
    }
    .ranking[hidden] { display: none; }

    .ranking h2 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: 800;
    }

    .ranking ol {
      margin: 0;
      padding-left: 28px;
      columns: 2;
      column-gap: 40px;
      font-size: 17px;
      font-weight: 500;
    }

    .ranking li {
      padding: 3px 0;
      break-inside: avoid;
    }

    .ranking .moves {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .ranking .empty {
      column-span: all;
      list-style: none;
      margin-left: -28px;
      color: var(--plum-soft);
    }

    @keyframes pop {
      from { transform: translateY(40px) scale(0.85); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tray { transition: none; }
      .card-float,
      .card-inner,
      .shadow,
      .win-panel { animation: none !important; }
      .card-inner { transition: transform var(--flip) ease-in-out; }
    }

    #test-results {
      margin-top: 40px;
      width: var(--tray-w);
      max-width: 100%;
      padding: 14px 18px;
      background: var(--paper);
      border-radius: 12px;
      font-family: Consolas, monospace;
      white-space: pre-wrap;
      box-shadow: 0 4px 0 var(--cardboard);
    }
    #test-results .pass { color: #2b7a3b; }
    #test-results .fail { color: #b3261e; }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>Para Buch!</h1>
      <p class="hint">Odkrywaj po dwie karty i znajdź wszystkie 15 par.</p>
      <p class="account" id="account" hidden>
        <span id="account-text"></span>
        <button type="button" class="link" id="account-login">Zaloguj się</button>
        <button type="button" class="link" id="account-logout" hidden>Wyloguj</button>
      </p>
    </div>
    <div class="toolbar">
      <span id="moves">Ruchy: 0</span>
      <button type="button" class="action" id="new-game">Nowa gra</button>
    </div>
  </header>

  <div class="scene" id="scene">
    <div class="tray" id="tray">
      <div class="board" id="board"></div>
    </div>
    <div class="win" id="win" hidden>
      <div class="win-panel">
        <span id="win-text" class="panel-title"></span>
        <span class="score-status" id="score-status" role="status"></span>
        <button type="button" class="link" id="score-login" hidden>Zaloguj się, żeby zapisać wynik</button>
        <button type="button" class="action" id="play-again">Zagraj ponownie</button>
      </div>
    </div>
    <div class="win" id="resume" hidden>
      <div class="win-panel">
        <span id="resume-text" class="panel-title"></span>
        <div class="panel-buttons">
          <button type="button" class="action" id="resume-yes">Wznów</button>
          <button type="button" class="action secondary" id="resume-no">Zacznij od nowa</button>
        </div>
      </div>
    </div>
  </div>

  <section class="ranking" id="ranking" hidden>
    <h2>Najlepsze wyniki</h2>
    <ol id="ranking-list"></ol>
  </section>

  <div class="modal" id="auth-modal" hidden>
    <form class="win-panel auth-panel" id="auth-form" novalidate>
      <span class="panel-title" id="auth-title">Zaloguj się</span>
      <label>
        Login
        <input id="auth-login" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false">
        <span class="field-hint" id="auth-login-hint" hidden>3–20 znaków: małe litery, cyfry oraz _ . -</span>
      </label>
      <label>
        Hasło
        <input id="auth-password" type="password" autocomplete="current-password">
        <span class="field-hint" id="auth-password-hint" hidden>Co najmniej 6 znaków. Hasła nie da się odzyskać, zapamiętaj je.</span>
      </label>
      <span class="score-status" id="auth-status" role="status"></span>
      <div class="panel-buttons">
        <button type="submit" class="action" id="auth-submit">Zaloguj</button>
        <button type="button" class="action secondary" id="auth-cancel">Anuluj</button>
      </div>
      <button type="button" class="link" id="auth-switch">Nie masz konta? Załóż je</button>
    </form>
  </div>

  <!-- Logika gry: czyste funkcje, bez DOM, window i timerów -->
  <script>
    const SYMBOL_POOL = [
      '🍎', '🍌', '🍇', '🍓', '🍒', '🍍', '🥝', '🍉', '🍋', '🥥',
      '🐶', '🐱', '🦊', '🐼', '🐸', '🦁', '🐵', '🐧', '🦄', '🐙'
    ];
    const PAIRS = 15;

    function shuffle(items, random) {
      const result = items.slice();
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function createDeck(symbols, random = Math.random) {
      const doubled = symbols.flatMap(symbol => [symbol, symbol]);
      return shuffle(doubled, random).map(symbol => ({ symbol, matched: false }));
    }

    function newGame(random = Math.random) {
      const symbols = shuffle(SYMBOL_POOL, random).slice(0, PAIRS);
      return {
        cards: createDeck(symbols, random),
        revealed: [],
        moves: 0,
        locked: false,
        won: false
      };
    }

    function flipCard(state, index) {
      const card = state.cards[index];
      if (state.locked || state.won || !card || card.matched || state.revealed.includes(index)) {
        return state;
      }

      const revealed = [...state.revealed, index];
      if (revealed.length < 2) {
        return { ...state, revealed };
      }

      const moves = state.moves + 1;
      const [first, second] = revealed;
      if (state.cards[first].symbol !== state.cards[second].symbol) {
        return { ...state, revealed, moves, locked: true };
      }

      const cards = state.cards.map((c, i) =>
        i === first || i === second ? { ...c, matched: true } : c
      );
      return {
        ...state,
        cards,
        revealed: [],
        moves,
        won: cards.every(c => c.matched)
      };
    }

    function hideUnmatched(state) {
      return { ...state, revealed: [], locked: false };
    }

    // Stan do zapisu: nietrafiona para jest od razu zakryta, żeby po wznowieniu nie wisiała blokada
    function snapshot(state) {
      const s = state.locked ? hideUnmatched(state) : state;
      return {
        cards: s.cards.map(c => ({ symbol: c.symbol, matched: c.matched })),
        revealed: s.revealed.slice(),
        moves: s.moves,
        locked: false,
        won: s.won
      };
    }

    // Odtwarza stan z zapisu; zwraca null, gdy dane są uszkodzone albo partia jest skończona
    function restoreGame(data) {
      if (!data || !Array.isArray(data.cards) || data.cards.length !== PAIRS * 2) return null;
      if (!Number.isInteger(data.moves) || data.moves < 0) return null;

      const counts = {};
      for (const c of data.cards) {
        if (!c || typeof c.symbol !== 'string' || typeof c.matched !== 'boolean') return null;
        counts[c.symbol] = (counts[c.symbol] || 0) + 1;
      }
      if (Object.values(counts).some(n => n !== 2)) return null;

      const revealed = Array.isArray(data.revealed) ? data.revealed : [];
      const revealedOk = revealed.length <= 1 && revealed.every(i =>
        Number.isInteger(i) && i >= 0 && i < data.cards.length && !data.cards[i].matched);
      if (!revealedOk) return null;

      const cards = data.cards.map(c => ({ symbol: c.symbol, matched: c.matched }));
      if (cards.every(c => c.matched)) return null;
      return { cards, revealed: revealed.slice(), moves: data.moves, locked: false, won: false };
    }

    // Login trzymamy małymi literami, więc „Ala” i „ala” to to samo konto
    function normalizeLogin(raw) {
      return String(raw ?? '').trim().toLowerCase();
    }

    // Zwraca opis błędu albo pusty tekst; te same zasady sprawdza baza (supabase/schema.sql)
    function loginError(login) {
      return /^[a-z0-9_.-]{3,20}$/.test(login)
        ? ''
        : 'Login musi mieć 3–20 znaków: małe litery, cyfry oraz _ . -';
    }

    function passwordError(password) {
      return String(password ?? '').length >= 6 ? '' : 'Hasło musi mieć co najmniej 6 znaków.';
    }
  </script>

  <!-- Zapis w Supabase: konta, przerwana partia i tabela wyników -->
  <script>
    // Klucz publishable jest publiczny z założenia; dostęp ograniczają reguły RLS (supabase/schema.sql)
    const SUPABASE_URL = 'https://xylrrddyfqqctzujypqf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_pzgajJoQ4zAjKv7o-ye0oA_aNbIkE3Z';
    const TOP_SCORES = 10;
    // Supabase loguje e-mailem, więc login zamieniamy na techniczny adres; nikt na niego nie pisze
    const LOGIN_EMAIL_DOMAIN = 'gracze.para-buch.pl';

    const AUTH_MESSAGES = {
      user_already_exists: 'Ten login jest już zajęty.',
      invalid_credentials: 'Nieprawidłowy login lub hasło.',
      weak_password: 'Hasło jest za słabe.',
      over_request_rate_limit: 'Za dużo prób. Spróbuj za kilka minut.',
      email_provider_disabled: 'Rejestracja jest wyłączona w ustawieniach bazy.'
    };

    const store = (() => {
      let client = null;
      let user = null; // { id, login }; login === null oznacza gościa
      let lastSynced;
      let nextSave = null;
      let flushing = null;

      // Zwraca zapisaną partię (albo null); przy braku konfiguracji lub błędzie gra działa bez zapisu
      async function init() {
        if (!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return null;
        try {
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          const { data: { session } } = await client.auth.getSession();
          await useSession(session || await signInGuest());
          return await loadGame();
        } catch (e) {
          console.warn('Supabase niedostępny, gra działa bez zapisu:', e.message || e);
          client = null;
          user = null;
          return null;
        }
      }

      async function signInGuest() {
        const { data, error } = await client.auth.signInAnonymously();
        if (error) throw error;
        return data.session;
      }

      async function useSession(session) {
        let login = null;
        if (!session.user.is_anonymous) {
          const { data, error } = await client.from('profiles').select('login').eq('id', session.user.id).maybeSingle();
          if (error) throw error;
          login = data ? data.login : null;
        }
        user = { id: session.user.id, login };
        lastSynced = undefined;
      }

      async function loadGame() {
        const { data, error } = await client.from('games').select('state').eq('user_id', user.id).maybeSingle();
        if (error) throw error;
        return data ? data.state : null;
      }

      // Zapisuje partię albo ją kasuje (saved = null). W locie jest najwyżej jedno żądanie;
      // stany, które przyszły w międzyczasie, zastępuje najnowszy, więc przy szybkim klikaniu nie rośnie kolejka
      function sync(saved) {
        if (!client || !user) return;
        const json = JSON.stringify(saved);
        if (json === lastSynced) return;
        lastSynced = json;
        nextSave = { userId: user.id, saved };
        if (!flushing) flushing = flush();
      }

      async function flush() {
        while (nextSave) {
          const { userId, saved } = nextSave;
          nextSave = null;
          const { error } = saved
            ? await client.from('games').upsert({ user_id: userId, state: saved, updated_at: new Date().toISOString() })
            : await client.from('games').delete().eq('user_id', userId);
          if (error) console.warn('Nie udało się zapisać partii:', error.message);
        }
        flushing = null;
      }

      function authMessage(error) {
        if (AUTH_MESSAGES[error.code]) return AUTH_MESSAGES[error.code];
        console.warn('Błąd logowania:', error.code, error.message);
        return 'Nie udało się. Spróbuj ponownie.';
      }

      // Rejestracja i logowanie zwracają pusty tekst przy sukcesie albo komunikat dla gracza.
      // Przed zmianą konta czekamy na zapisy poprzedniego gracza, bo po zmianie sesji baza by je odrzuciła.
      async function signUp(login, password) {
        await flushing;
        const { data, error } = await client.auth.signUp({
          email: `${login}@${LOGIN_EMAIL_DOMAIN}`,
          password,
          options: { data: { login } }
        });
        if (error) return authMessage(error);
        if (!data.session) return 'Konto czeka na potwierdzenie e-mail. W Supabase trzeba wyłączyć „Confirm email”.';
        await useSession(data.session);
        return '';
      }

      async function signIn(login, password) {
        await flushing;
        const { data, error } = await client.auth.signInWithPassword({
          email: `${login}@${LOGIN_EMAIL_DOMAIN}`,
          password
        });
        if (error) return authMessage(error);
        await useSession(data.session);
        return '';
      }

      // Po wylogowaniu gra toczy się dalej jako nowy gość
      async function signOut() {
        await flushing;
        await client.auth.signOut();
        await useSession(await signInGuest());
      }

      async function submitScore(moves) {
        if (!client || !user || !user.login) return false;
        const { error } = await client.from('scores').insert({ moves });
        if (error) console.warn('Nie udało się zapisać wyniku:', error.message);
        return !error;
      }

      async function topScores() {
        if (!client) return [];
        const { data, error } = await client.from('scores')
          .select('moves, profiles(login)')
          .order('moves')
          .order('created_at')
          .limit(TOP_SCORES);
        if (error) {
          console.warn('Nie udało się pobrać rankingu:', error.message);
          return [];
        }
        return data.map(row => ({ login: row.profiles ? row.profiles.login : '?', moves: row.moves }));
      }

      // Profil gracza: liczba wygranych i najlepszy wynik
      async function myStats() {
        if (!client || !user || !user.login) return null;
        const { data, count, error } = await client.from('scores')
          .select('moves', { count: 'exact' })
          .eq('user_id', user.id)
          .order('moves')
          .limit(1);
        if (error) {
          console.warn('Nie udało się pobrać profilu:', error.message);
          return null;
        }
        return { wins: count || 0, best: data.length ? data[0].moves : null };
      }

      return {
        init, loadGame, sync, signUp, signIn, signOut, submitScore, topScores, myStats,
        get enabled() { return client !== null; },
        get login() { return user ? user.login : null; }
      };
    })();
  </script>

  <!-- Widok: rysowanie planszy i obsługa kliknięć -->
  <script>
    const HIDE_DELAY_MS = 1000;
    const MAX_TILT_DEG = 5;

    const sceneEl = document.getElementById('scene');
    const trayEl = document.getElementById('tray');
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const winEl = document.getElementById('win');
    const winTextEl = document.getElementById('win-text');
    const scoreStatusEl = document.getElementById('score-status');
    const scoreLoginEl = document.getElementById('score-login');
    const resumeEl = document.getElementById('resume');
    const resumeTextEl = document.getElementById('resume-text');
    const resumeNoEl = document.getElementById('resume-no');
    const rankingEl = document.getElementById('ranking');
    const rankingListEl = document.getElementById('ranking-list');
    const accountEl = document.getElementById('account');
    const accountTextEl = document.getElementById('account-text');
    const accountLoginEl = document.getElementById('account-login');
    const accountLogoutEl = document.getElementById('account-logout');
    const authModalEl = document.getElementById('auth-modal');
    const authFormEl = document.getElementById('auth-form');
    const authTitleEl = document.getElementById('auth-title');
    const authLoginEl = document.getElementById('auth-login');
    const authPasswordEl = document.getElementById('auth-password');
    const authLoginHintEl = document.getElementById('auth-login-hint');
    const authPasswordHintEl = document.getElementById('auth-password-hint');
    const authStatusEl = document.getElementById('auth-status');
    const authSubmitEl = document.getElementById('auth-submit');
    const authSwitchEl = document.getElementById('auth-switch');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const TEST_MODE = new URLSearchParams(location.search).has('test');

    let state;
    let hideTimer = null;
    let cardEls = [];
    // Zapis startuje dopiero po decyzji o wznowieniu, żeby nie nadpisać przerwanej partii
    let persistReady = false;
    let pendingRestore = null;
    let scoreSaved = false;
    let authMode = 'login';

    function buildBoard() {
      boardEl.innerHTML = '';
      cardEls = state.cards.map((card, index) => {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'card';
        // Kolejność opadania przy rozdaniu i lekki skręt każdej karty w locie
        el.style.setProperty('--i', index);
        el.style.setProperty('--r', `${(index * 37) % 13 - 6}deg`);
        el.innerHTML =
          '<span class="shadow"></span>' +
          '<span class="card-float">' +
            '<span class="card-inner">' +
              '<span class="edge edge-t"></span>' +
              '<span class="edge edge-b"></span>' +
              '<span class="edge edge-l"></span>' +
              '<span class="edge edge-r"></span>' +
              '<span class="face back"></span>' +
              '<span class="face front"></span>' +
            '</span>' +
          '</span>';
        el.querySelector('.front').textContent = card.symbol;
        el.addEventListener('click', () => onCardClick(index));
        boardEl.appendChild(el);
        return el;
      });
    }

    function render() {
      state.cards.forEach((card, index) => {
        const el = cardEls[index];
        const revealed = state.revealed.includes(index);
        // Animacja obrotu dopiero po pierwszej zmianie, żeby rozdanie nie podskakiwało
        if (el.classList.contains('matched') !== card.matched ||
            el.classList.contains('revealed') !== revealed) {
          el.classList.add('animate');
        }
        el.classList.toggle('matched', card.matched);
        el.classList.toggle('revealed', revealed);
        el.setAttribute('aria-label',
          card.matched ? `${card.symbol}, para znaleziona` : revealed ? card.symbol : 'Zakryta karta');
      });
      boardEl.classList.toggle('locked', state.locked);
      movesEl.textContent = `Ruchy: ${state.moves}`;
      winTextEl.textContent = `Brawo! Ukończono w ${state.moves} ruchach`;
      winEl.hidden = !state.won;
      scoreLoginEl.hidden = !(state.won && store.enabled && !store.login && !scoreSaved);
    }

    // Partia bez ruchów albo wygrana nie ma czego wznawiać, więc kasujemy zapis
    function persist() {
      if (!persistReady) return;
      store.sync(state.won || state.moves === 0 ? null : snapshot(state));
    }

    function onCardClick(index) {
      const next = flipCard(state, index);
      if (next === state) return;
      state = next;
      render();
      persist();
      if (state.won) saveScore();

      if (state.locked) {
        hideTimer = setTimeout(() => {
          hideTimer = null;
          state = hideUnmatched(state);
          render();
        }, HIDE_DELAY_MS);
      }
    }

    function showGame(newState) {
      clearTimeout(hideTimer);
      hideTimer = null;
      state = newState;
      scoreSaved = false;
      scoreStatusEl.textContent = '';
      buildBoard();
      render();
    }

    function startGame() {
      // „Nowa gra” w czasie pytania o wznowienie oznacza rezygnację z wznowienia
      if (!resumeEl.hidden) {
        resumeEl.hidden = true;
        pendingRestore = null;
        persistReady = true;
      }
      showGame(newGame());
      persist();
    }

    // Zalogowanemu wynik zapisuje się sam po wygranej; gość może się zalogować w oknie gratulacji
    async function saveScore() {
      if (!store.enabled || !state.won || scoreSaved) return;
      if (!store.login) {
        scoreStatusEl.textContent = 'Wyniki gości nie trafiają do rankingu.';
        render();
        return;
      }
      scoreSaved = true;
      const login = store.login;
      scoreStatusEl.textContent = 'Zapisuję wynik…';
      render();
      if (await store.submitScore(state.moves)) {
        scoreStatusEl.textContent = `Wynik zapisany na koncie ${login}!`;
        refreshRanking();
        refreshAccount();
      } else {
        scoreSaved = false;
        scoreStatusEl.textContent = 'Nie udało się zapisać wyniku.';
      }
      render();
    }

    async function refreshAccount() {
      if (!store.enabled) {
        accountEl.hidden = true;
        return;
      }
      const login = store.login;
      accountEl.hidden = false;
      accountLoginEl.hidden = Boolean(login);
      accountLogoutEl.hidden = !login;
      if (!login) {
        accountTextEl.textContent = 'Grasz jako gość. ';
        accountLoginEl.textContent = 'Zaloguj się albo załóż konto';
        return;
      }
      accountTextEl.replaceChildren('Zalogowano: ', Object.assign(document.createElement('strong'), { textContent: login }), '. ');
      const stats = await store.myStats();
      if (stats && store.login === login) {
        const best = stats.best === null ? 'brak' : `${stats.best} ${movesWord(stats.best)}`;
        accountTextEl.append(`Wygrane: ${stats.wins}, najlepszy wynik: ${best}. `);
      }
    }

    function setAuthMode(mode) {
      authMode = mode;
      const register = mode === 'register';
      authTitleEl.textContent = register ? 'Załóż konto' : 'Zaloguj się';
      authSubmitEl.textContent = register ? 'Załóż konto' : 'Zaloguj';
      authSwitchEl.textContent = register ? 'Masz już konto? Zaloguj się' : 'Nie masz konta? Załóż je';
      authPasswordEl.autocomplete = register ? 'new-password' : 'current-password';
      authLoginHintEl.hidden = !register;
      authPasswordHintEl.hidden = !register;
      authStatusEl.textContent = '';
      authStatusEl.classList.remove('error');
    }

    function openAuth() {
      setAuthMode('login');
      authPasswordEl.value = '';
      authSubmitEl.disabled = false;
      authModalEl.hidden = false;
      authLoginEl.focus();
    }

    function closeAuth() {
      authModalEl.hidden = true;
    }

    function showAuthError(message) {
      authStatusEl.textContent = message;
      authStatusEl.classList.add('error');
    }

    async function submitAuth(event) {
      event.preventDefault();
      const login = normalizeLogin(authLoginEl.value);
      const password = authPasswordEl.value;
      const invalid = loginError(login) || passwordError(password);
      if (invalid) {
        showAuthError(authMode === 'register' ? invalid : 'Nieprawidłowy login lub hasło.');
        return;
      }
      authSubmitEl.disabled = true;
      authStatusEl.classList.remove('error');
      authStatusEl.textContent = authMode === 'register' ? 'Zakładam konto…' : 'Loguję…';
      let message;
      try {
        message = authMode === 'register'
          ? await store.signUp(login, password)
          : await store.signIn(login, password);
      } catch (e) {
        console.warn('Błąd połączenia przy logowaniu:', e.message || e);
        message = 'Brak połączenia z bazą. Spróbuj ponownie.';
      }
      authSubmitEl.disabled = false;
      if (message) {
        showAuthError(message);
        return;
      }
      authPasswordEl.value = '';
      closeAuth();
      onAccountChanged();
    }

    // Po zalogowaniu: wygrana partia od razu trafia na konto, a przerwaną partię z konta można wznowić
    async function onAccountChanged() {
      refreshAccount();
      if (state.won) {
        saveScore();
        return;
      }
      persistReady = false;
      let saved = null;
      try {
        saved = await store.loadGame();
      } catch (e) {
        console.warn('Nie udało się wczytać partii z konta:', e.message || e);
      }
      offerResume(saved, true);
    }

    async function logout() {
      try {
        await store.signOut();
      } catch (e) {
        console.warn('Błąd przy wylogowaniu:', e.message || e);
      }
      refreshAccount();
      render();
      persist();
    }

    // Ranking zaczyna się od 15 ruchów, więc forma „ruch” nie występuje
    function movesWord(n) {
      const lastTwo = n % 100;
      return n % 10 >= 2 && n % 10 <= 4 && (lastTwo < 12 || lastTwo > 14) ? 'ruchy' : 'ruchów';
    }

    async function refreshRanking() {
      const rows = await store.topScores();
      const items = rows.map(row => {
        const li = document.createElement('li');
        li.textContent = `${row.login}: `;
        const moves = document.createElement('span');
        moves.className = 'moves';
        moves.textContent = `${row.moves} ${movesWord(row.moves)}`;
        li.appendChild(moves);
        return li;
      });
      if (items.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'Brak wyników. Wygraj i zajmij pierwsze miejsce!';
        items.push(li);
      }
      rankingListEl.replaceChildren(...items);
      rankingEl.hidden = false;
    }

    function onStoreReady(saved) {
      if (!store.enabled) return;
      refreshRanking();
      refreshAccount();
      offerResume(saved, false);
    }

    // Pyta o wznowienie zapisanej partii; po zalogowaniu „nie” oznacza grę dalej obecną partią
    function offerResume(saved, afterLogin) {
      const restored = restoreGame(saved);
      const same = restored && JSON.stringify(restored) === JSON.stringify(restoreGame(snapshot(state)));
      if (restored && restored.moves > 0 && !same) {
        pendingRestore = restored;
        const pairs = restored.cards.filter(c => c.matched).length / 2;
        resumeTextEl.textContent =
          `Masz przerwaną grę (ruchy: ${restored.moves}, pary: ${pairs} z ${PAIRS}). Wznowić?`;
        resumeNoEl.textContent = afterLogin && state.moves > 0 ? 'Graj obecną' : 'Zacznij od nowa';
        resumeEl.hidden = false;
      } else {
        persistReady = true;
        persist();
      }
    }

    function answerResume(resume) {
      resumeEl.hidden = true;
      if (resume && pendingRestore) showGame(pendingRestore);
      pendingRestore = null;
      persistReady = true;
      persist();
    }

    // Taca wychyla się lekko za kursorem
    function tiltTray(event) {
      if (reducedMotion.matches) return;
      const box = sceneEl.getBoundingClientRect();
      const x = (event.clientX - box.left) / box.width - 0.5;
      const y = (event.clientY - box.top) / box.height - 0.5;
      trayEl.style.setProperty('--tilt-x', `${(x * MAX_TILT_DEG).toFixed(2)}deg`);
      trayEl.style.setProperty('--tilt-y', `${(-y * MAX_TILT_DEG * 0.7).toFixed(2)}deg`);
    }

    function resetTilt() {
      trayEl.style.setProperty('--tilt-x', '0deg');
      trayEl.style.setProperty('--tilt-y', '0deg');
    }

    sceneEl.addEventListener('pointermove', tiltTray);
    sceneEl.addEventListener('pointerleave', resetTilt);
    document.getElementById('new-game').addEventListener('click', startGame);
    document.getElementById('play-again').addEventListener('click', startGame);
    document.getElementById('resume-yes').addEventListener('click', () => answerResume(true));
    document.getElementById('resume-no').addEventListener('click', () => answerResume(false));
    accountLoginEl.addEventListener('click', openAuth);
    scoreLoginEl.addEventListener('click', openAuth);
    accountLogoutEl.addEventListener('click', logout);
    authFormEl.addEventListener('submit', submitAuth);
    authSwitchEl.addEventListener('click', () => setAuthMode(authMode === 'login' ? 'register' : 'login'));
    document.getElementById('auth-cancel').addEventListener('click', closeAuth);
    authModalEl.addEventListener('click', event => { if (event.target === authModalEl) closeAuth(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && !authModalEl.hidden) closeAuth(); });

    showGame(newGame());
    if (!TEST_MODE) store.init().then(onStoreReady);
  </script>

  <!-- Testy: uruchamiane tylko z parametrem ?test -->
  <script>
    if (new URLSearchParams(location.search).has('test')) {
      runTests();
    }

    function runTests() {
      // Deterministyczny generator (LCG) do powtarzalnych tasowań
      function seeded(seed) {
        let s = seed;
        return () => {
          s = (s * 1664525 + 1013904223) % 4294967296;
          return s / 4294967296;
        };
      }

      function assert(condition, message) {
        if (!condition) throw new Error(message);
      }

      const symbols = SYMBOL_POOL.slice(0, PAIRS);

      // Stan z talią ułożoną parami: indeksy 0/1 to para, 2/3 to para itd.
      function orderedState() {
        return {
          cards: symbols.flatMap(s => [{ symbol: s, matched: false }, { symbol: s, matched: false }]),
          revealed: [],
          moves: 0,
          locked: false,
          won: false
        };
      }

      const tests = [
        ['Talia ma 30 kart, każdy z 15 symboli dokładnie dwa razy', () => {
          const deck = createDeck(symbols, seeded(1));
          assert(deck.length === 30, `oczekiwano 30 kart, jest ${deck.length}`);
          symbols.forEach(s => {
            const count = deck.filter(c => c.symbol === s).length;
            assert(count === 2, `symbol ${s} występuje ${count} razy`);
          });
          assert(deck.every(c => c.matched === false), 'karty nie powinny być znalezione');
        }],

        ['Ta sama funkcja losująca daje to samo ułożenie, tasowanie zmienia kolejność', () => {
          const a = createDeck(symbols, seeded(42)).map(c => c.symbol).join();
          const b = createDeck(symbols, seeded(42)).map(c => c.symbol).join();
          const unshuffled = symbols.flatMap(s => [s, s]).join();
          assert(a === b, 'ułożenia różnią się mimo tego samego ziarna');
          assert(a !== unshuffled, 'talia nie została przetasowana');
        }],

        ['newGame zwraca stan początkowy z 15 różnymi symbolami', () => {
          const s = newGame(seeded(7));
          assert(s.cards.length === 30, 'talia powinna mieć 30 kart');
          assert(new Set(s.cards.map(c => c.symbol)).size === 15, 'powinno być 15 różnych symboli');
          assert(s.moves === 0 && !s.locked && !s.won && s.revealed.length === 0, 'zły stan początkowy');
        }],

        ['Odkrycie pierwszej karty: karta w revealed, moves bez zmian', () => {
          const s = flipCard(orderedState(), 0);
          assert(s.revealed.length === 1 && s.revealed[0] === 0, 'karta 0 powinna być w revealed');
          assert(s.moves === 0, `moves = ${s.moves}`);
        }],

        ['Odkrycie pary: obie matched, revealed puste, moves = 1', () => {
          const s = flipCard(flipCard(orderedState(), 0), 1);
          assert(s.cards[0].matched && s.cards[1].matched, 'para nie jest oznaczona');
          assert(s.revealed.length === 0, 'revealed nie jest puste');
          assert(s.moves === 1, `moves = ${s.moves}`);
          assert(!s.locked, 'plansza nie powinna być zablokowana');
        }],

        ['Odkrycie dwóch różnych kart: locked, moves = 1', () => {
          const s = flipCard(flipCard(orderedState(), 0), 2);
          assert(s.locked === true, 'plansza powinna być zablokowana');
          assert(s.moves === 1, `moves = ${s.moves}`);
          assert(s.revealed.length === 2, 'obie karty powinny pozostać odkryte');
        }],

        ['Kliknięcie w czasie blokady nie zmienia stanu', () => {
          const locked = flipCard(flipCard(orderedState(), 0), 2);
          assert(flipCard(locked, 4) === locked, 'stan zmienił się podczas blokady');
        }],

        ['Ponowne kliknięcie odkrytej karty nie zmienia stanu i nie liczy ruchu', () => {
          const one = flipCard(orderedState(), 0);
          const again = flipCard(one, 0);
          assert(again === one, 'stan zmienił się');
          assert(again.moves === 0, 'naliczono ruch');
        }],

        ['Kliknięcie znalezionej karty nie zmienia stanu', () => {
          const s = flipCard(flipCard(orderedState(), 0), 1);
          assert(flipCard(s, 0) === s, 'stan zmienił się');
        }],

        ['hideUnmatched zakrywa obie karty i zdejmuje blokadę', () => {
          const s = hideUnmatched(flipCard(flipCard(orderedState(), 0), 2));
          assert(s.revealed.length === 0, 'karty nadal odkryte');
          assert(s.locked === false, 'blokada nie została zdjęta');
          assert(s.moves === 1, 'hideUnmatched nie powinno zmieniać moves');
        }],

        ['Znalezienie wszystkich 15 par ustawia won', () => {
          let s = orderedState();
          for (let i = 0; i < 30; i += 2) {
            assert(!s.won, `won ustawione przedwcześnie przy parze ${i / 2}`);
            s = flipCard(flipCard(s, i), i + 1);
          }
          assert(s.won === true, 'won powinno być true');
          assert(s.moves === 15, `moves = ${s.moves}`);
          assert(flipCard(s, 0) === s, 'po wygranej kliknięcia powinny być ignorowane');
        }],

        ['flipCard nie modyfikuje przekazanego stanu', () => {
          const cases = [
            [orderedState(), 0],
            [flipCard(orderedState(), 0), 1],
            [flipCard(orderedState(), 0), 2]
          ];
          cases.forEach(([input, index]) => {
            const snapshot = JSON.stringify(input);
            flipCard(input, index);
            assert(JSON.stringify(input) === snapshot, `stan wejściowy zmieniony (karta ${index})`);
          });
        }],

        ['snapshot zakrywa nietrafioną parę i zdejmuje blokadę, nie zmieniając stanu wejściowego', () => {
          const locked = flipCard(flipCard(orderedState(), 0), 2);
          const before = JSON.stringify(locked);
          const saved = snapshot(locked);
          assert(saved.revealed.length === 0 && saved.locked === false, 'para nie została zakryta');
          assert(saved.moves === 1, `moves = ${saved.moves}`);
          assert(JSON.stringify(locked) === before, 'stan wejściowy zmieniony');
        }],

        ['restoreGame odtwarza zapisaną partię', () => {
          const played = flipCard(flipCard(flipCard(orderedState(), 0), 1), 2);
          const restored = restoreGame(JSON.parse(JSON.stringify(snapshot(played))));
          assert(restored !== null, 'zapis odrzucony');
          assert(restored.moves === 1, `moves = ${restored.moves}`);
          assert(restored.cards[0].matched && restored.cards[1].matched, 'zgubiono znalezioną parę');
          assert(restored.revealed.length === 1 && restored.revealed[0] === 2, 'zgubiono odkrytą kartę');
          assert(!restored.locked && !restored.won, 'zły stan blokady lub wygranej');
          const next = flipCard(restored, 3);
          assert(next.cards[3].matched && next.moves === 2, 'po wznowieniu gra nie toczy się dalej');
        }],

        ['restoreGame odrzuca uszkodzone dane i skończoną partię', () => {
          const good = snapshot(orderedState());
          const broken = [
            null,
            'tekst',
            { ...good, cards: good.cards.slice(0, 28) },
            { ...good, cards: good.cards.map((c, i) => i === 0 ? { ...c, symbol: 'X' } : c) },
            { ...good, moves: -1 },
            { ...good, moves: 1.5 },
            { ...good, revealed: [0, 1] },
            { ...good, revealed: [99] }
          ];
          broken.forEach((data, i) => assert(restoreGame(data) === null, `przypadek ${i} nie został odrzucony`));

          let won = orderedState();
          for (let i = 0; i < 30; i += 2) won = flipCard(flipCard(won, i), i + 1);
          assert(restoreGame(snapshot(won)) === null, 'wygrana partia nie powinna być wznawiana');
        }],

        ['normalizeLogin przycina spacje i zmienia na małe litery', () => {
          assert(normalizeLogin('  Ala_Kot ') === 'ala_kot', `wynik: ${normalizeLogin('  Ala_Kot ')}`);
          assert(normalizeLogin(undefined) === '', 'brak loginu powinien dać pusty tekst');
        }],

        ['loginError przepuszcza poprawne loginy i odrzuca błędne', () => {
          ['ala', 'gracz_1', 'a.b-c', 'x'.repeat(20)].forEach(login =>
            assert(loginError(login) === '', `odrzucono poprawny login ${login}`));
          ['', 'ab', 'x'.repeat(21), 'ala kot', 'Ala', 'zażółć', 'ala@x'].forEach(login =>
            assert(loginError(login) !== '', `przepuszczono błędny login "${login}"`));
        }],

        ['passwordError wymaga co najmniej 6 znaków', () => {
          assert(passwordError('123456') === '', 'odrzucono hasło z 6 znakami');
          assert(passwordError('12345') !== '', 'przepuszczono hasło z 5 znakami');
          assert(passwordError(undefined) !== '', 'przepuszczono brak hasła');
        }]
      ];

      const results = tests.map(([name, fn]) => {
        try {
          fn();
          return { name, ok: true };
        } catch (e) {
          return { name, ok: false, error: e.message };
        }
      });

      const passed = results.filter(r => r.ok).length;
      const failed = results.length - passed;

      const box = document.createElement('div');
      box.id = 'test-results';
      const header = document.createElement('strong');
      header.textContent = `Testy: ${passed} zaliczonych, ${failed} niezaliczonych\n\n`;
      box.appendChild(header);

      console.log(`Testy: ${passed} zaliczonych, ${failed} niezaliczonych`);
      results.forEach(r => {
        const line = document.createElement('div');
        line.className = r.ok ? 'pass' : 'fail';
        line.textContent = r.ok ? `✔ ${r.name}` : `✘ ${r.name}: ${r.error}`;
        box.appendChild(line);
        if (r.ok) console.log(`✔ ${r.name}`);
        else console.error(`✘ ${r.name}: ${r.error}`);
      });

      document.body.appendChild(box);
    }
  </script>
</body>
</html>
